<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行动看板 · 用户洞察 V2</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<div id="topbar"></div>
<div class="wrap">
  <p class="crumb"><a href="../index.html">工作台</a> / <a href="index.html">洞察报告</a> / 行动看板</p>
  <div class="hero">
    <div class="tag">Action Board · M5</div>
    <h1>行动看板
      <small>把报告里的每条建议转成一条可管理的 Action：派单 → 进行中 → 已完成 → 已验证（回填实际效果，与预计效果做对比）</small>
    </h1>
    <div class="meta" id="ameta"></div>
  </div>

  <div class="score" id="astats"></div>

  <div class="callout info">
    <p class="t">回填的实际效果会反哺「预计效果」的估算准确度</p>
    <p>这是让产品越用越准的机制。<strong>「预计效果命中率」＝实际效果落在预计区间内的建议数 ÷ 已回填建议数</strong>，是核心质量指标之一。未回填时不计算、不展示，也不允许用估算值充数。</p>
  </div>

  <div class="panel">
    <div class="panel-h">
      <h3>建议列表</h3>
      <div class="right">
        <div class="seg" id="seg">
          <button data-f="all" aria-pressed="true">全部</button>
          <button data-f="P0" aria-pressed="false">P0</button>
          <button data-f="P1" aria-pressed="false">P1</button>
          <button data-f="P2" aria-pressed="false">P2</button>
        </div>
        <button class="btn ghost sm" id="export">导出 CSV</button>
      </div>
    </div>
    <div id="alist"></div>
  </div>
</div>

<script type="module">
import { mountTopbar, loadActions, saveAction, loadReport, getTask, getState, setState, qs, esc, toast, reportActionsKey } from "../assets/app.mjs";

mountTopbar("actions");
const id = qs("id");
const task = id ? await getTask(id) : null;

const STATUS = ["待处理", "进行中", "已完成", "已验证"];
const TONE = { "待处理": "b-gray", "进行中": "b-blue", "已完成": "b-amber", "已验证": "b-green" };

async function main() {
  const wrapNotice = (t, b) => {
    document.querySelector(".hero h1").firstChild.textContent = t;
    document.getElementById("alist").innerHTML = `<div class="callout warn"><p class="t">${esc(t)}</p><p>${b}</p></div>`;
  };
  if (!task || !task.dataFile) return wrapNotice("没有可管理的建议", "请从<a href=\"../index.html\">工作台</a>选择一份已完成报告。");

  const report = await loadReport(task);
  const reportId = report.reportId;

  // 组装全部建议
  const all = [];
  for (const k of ["p0", "p1", "p2"]) {
    (report.actions[k]?.items || []).forEach((it, i) => {
      all.push({ id: `${k}-${i}`, level: k.toUpperCase(), when: report.actions[k].when, text: it.text, effect: it.effect });
    });
  }

  const state = await loadActions(task.id);
  for (const a of all) state[a.id] = state[a.id] || {status:"待处理",owner:"",due:"",actual:""};

  document.querySelector(".crumb").innerHTML =
    `<a href="../index.html">工作台</a> / <a href="index.html?id=${encodeURIComponent(id)}">${esc(report.meta.asin)} 洞察报告</a> / 行动看板`;

  document.getElementById("ameta").innerHTML = [
    ["ASIN", report.meta.asin], ["商品", report.meta.title],
    ["建议总数", all.length + " 条"], ["P0", (report.actions.p0?.items || []).length + " 条"],
    ["责任人", "可派单"], ["状态流", "待处理 → 进行中 → 已完成 → 已验证"],
  ].map(([k, v]) => `<span class="chip">${esc(k)} <b>${esc(v)}</b></span>`).join("");

  function stats() {
    const done = all.filter((a) => ["已完成", "已验证"].includes(state[a.id].status));
    const verified = all.filter((a) => state[a.id].status === "已验证");
    const hit = verified.filter((a) => state[a.id].actual && state[a.id].actual.trim() && state[a.id].actual.includes("%"));
    const rate = null;
    const pct = all.length ? Math.round((done.length / all.length) * 100) : 0;
    document.getElementById("astats").innerHTML = [
      { k: "采纳率", v: pct + "%", d: `已执行 ${done.length} / ${all.length} 条（PRD 目标 ≥40%）`, tone: pct >= 40 ? "g" : "a" },
      { k: "已回填效果", v: String(verified.length), d: "回填后才计入命中率，未回填不估算", tone: "" },
      { k: "预计效果命中率", v: rate == null ? "—" : rate + "%", d: rate == null ? "尚未定义可比的效果验收指标" : "实际落在预计区间的建议占比（目标 ≥60%）", tone: rate == null ? "" : rate >= 60 ? "g" : "a" },
      { k: "待处理", v: String(all.filter((a) => state[a.id].status === "待处理").length), d: "未开始执行的建议", tone: "" },
    ].map((c) => `<div class="kpi ${c.tone}"><div class="k">${c.k}</div><div class="v">${c.v}</div><div class="d">${c.d}</div></div>`).join("");
  }

  let filter = "all";
  function render() {
    const list = all.filter((a) => filter === "all" || a.level === filter);
    document.getElementById("alist").innerHTML = list.map((a) => {
      const s = state[a.id];
      const lvl = a.level.toLowerCase();
      return `<div class="act ${lvl} ${["已完成", "已验证"].includes(s.status) ? "done" : ""}" data-id="${a.id}">
        <div class="bd">
          <div class="nm"><span class="b ${a.level === "P0" ? "b-red" : a.level === "P1" ? "b-amber" : "b-green"}">${a.level}</span> ${esc(a.text.replace(/\*\*/g, ""))}</div>
          <div class="ef">预计效果：${esc(a.effect.replace(/\*\*/g, ""))}</div>
          <div class="meta">
            <span>责任人 <input type="text" data-f="owner" value="${esc(s.owner)}" placeholder="未指派" style="width:96px;padding:3px 7px;font-size:11.5px;border-radius:6px;display:inline-block;"></span>
            <span>截止 <input type="text" data-f="due" value="${esc(s.due)}" placeholder="YYYY-MM-DD" style="width:112px;padding:3px 7px;font-size:11.5px;border-radius:6px;display:inline-block;"></span>
          </div>
          <div class="meta">
            <span>实际效果 <input type="text" data-f="actual" value="${esc(s.actual)}" placeholder="回填实测值，如「评分 3.9 → 4.2」" style="width:300px;padding:3px 7px;font-size:11.5px;border-radius:6px;display:inline-block;"></span>
          </div>
        </div>
        <div class="rt"><span class="b ${TONE[s.status]}">${s.status}</span>
          <select data-f="status">${STATUS.map((x) => `<option${x === s.status ? " selected" : ""}>${x}</option>`).join("")}</select>
        </div>
      </div>`;
    }).join("") || `<div class="empty">该优先级下没有建议。</div>`;
    stats();
  }

  const queues=new Map();
  document.getElementById("alist").addEventListener("change", (e) => {
    const host=e.target.closest('.act'),f=e.target.dataset.f;
    if(!host||!['owner','due','actual','status'].includes(f))return;
    const key=host.dataset.id;state[key][f]=e.target.value;
    const snapshot={...state[key]},prior=queues.get(key)||Promise.resolve();
    const pending=prior.catch(()=>{}).then(()=>saveAction(task.id,key,snapshot)).then(()=>{toast('已保存');stats();}).catch(e=>{toast(e.message+'；本次修改未保存，请刷新核对。','warn');});
    queues.set(key,pending);
  });

  document.getElementById("seg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll("#seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });

  document.getElementById("export").addEventListener("click", () => {
    const head = "优先级,建议,预计效果,状态,责任人,截止,实际效果";
    const rows = all.map((a) => {
      const s = state[a.id];
      const c = (v) => `"${String(v || "").replace(/^[=+@-]/, "\'$&").replace(/"/g, '""').replace(/\*\*/g, "")}"`;
      return [a.level, c(a.text), c(a.effect), c(s.status), c(s.owner), c(s.due), c(s.actual)].join(",");
    });
    const blob = new Blob(["\ufeff" + head + "\n" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
    const el = document.createElement("a");
    el.href = URL.createObjectURL(blob);
    el.download = `${report.meta.asin}_行动清单.csv`;
    el.click();
    toast("已导出 CSV（含 BOM，Excel 直接可读）");
  });

  render();
}

main().catch((e) => {
  document.getElementById("alist").innerHTML = `<div class="callout warn"><p class="t">加载失败</p><p>${esc(String(e && e.message || e))}</p></div>`;
});
</script>
</body>
</html>
